# ============================================================================
# Authentication — opt-in scaffolding (docs/auth.md). HAND-AUTHORED SDL subset.
#
# `login` / `refreshJwtAuthToken` come from the wp-graphql-jwt-authentication
# plugin (the GO-LIVE GATE: install + verify against WPGraphQL 2.x — see
# docs/auth.md §Go-live). `sendPasswordResetEmail` / `resetUserPassword` /
# `viewer` are CORE WPGraphQL and were VERIFIED present on a live 2.x endpoint
# (2026-06-15). Regenerate the full SDL from live WP once the JWT plugin is on.
# ============================================================================

type RootMutation {
  # --- wp-graphql-jwt-authentication (verify on go-live) ---
  login(input: LoginInput!): LoginPayload
  refreshJwtAuthToken(input: RefreshJwtAuthTokenInput!): RefreshJwtAuthTokenPayload
  # --- core WPGraphQL (verified on 2.x) ---
  sendPasswordResetEmail(input: SendPasswordResetEmailInput!): SendPasswordResetEmailPayload
  resetUserPassword(input: ResetUserPasswordInput!): ResetUserPasswordPayload
}

input LoginInput {
  clientMutationId: String
  username: String!
  password: String!
}
type LoginPayload {
  authToken: String
  refreshToken: String
  user: User
}

input RefreshJwtAuthTokenInput {
  clientMutationId: String
  jwtRefreshToken: String!
}
type RefreshJwtAuthTokenPayload {
  authToken: String
}

# Core: `username` accepts a login OR an email. Returns success (the legacy `user`
# field is intentionally not selected — it leaks existence; we always show a generic
# "if an account exists…" message).
input SendPasswordResetEmailInput {
  clientMutationId: String
  username: String!
}
type SendPasswordResetEmailPayload {
  success: Boolean
}

# Core: completes the reset using the emailed key + login.
input ResetUserPasswordInput {
  clientMutationId: String
  key: String!
  login: String!
  password: String!
}
type ResetUserPasswordPayload {
  user: User
}
