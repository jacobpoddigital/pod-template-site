# Baseline WPGraphQL + WPGraphQL-for-ACF schema — HAND-AUTHORED.
#
# A minimal, valid subset covering page-by-slug + the 6 starter block layouts.
# It exists so `pnpm codegen` and `pnpm build` run with NO live WordPress
# (ADR 0013 — build green offline; the dev mock renders against it).
#
# Per project: once ACF fields are defined on real WP, REGENERATE this file —
#   pnpm dlx get-graphql-schema "$WPGRAPHQL_URL" > src/lib/cms/schema.graphql
# then `pnpm codegen` and commit. Type names below follow WPGraphQL-for-ACF's
# convention (Page_Pagefields_Blocks_<Layout>), so queries survive the swap.

schema {
  query: RootQuery
}

type RootQuery {
  page(id: ID!, idType: PageIdType): Page
  pages(first: Int, where: RootQueryToPageConnectionWhereArgs): RootQueryToPageConnection
  posts(first: Int, where: RootQueryToPostConnectionWhereArgs): RootQueryToPostConnection
  menuItems(where: RootQueryToMenuItemConnectionWhereArgs): RootQueryToMenuItemConnection
  siteOptions: SiteOptions
}

# Editor-managed chrome (header/footer). Menus → nav (WPGraphQL); site options →
# logo / CTA / footer extras (WPGraphQL-for-ACF options page). Per project: register
# the PRIMARY + FOOTER menu locations and a "Site Options" ACF options page, exposed
# to GraphQL, then regenerate this SDL.
enum MenuLocationEnum {
  PRIMARY
  FOOTER
}

input RootQueryToMenuItemConnectionWhereArgs {
  location: MenuLocationEnum
}

type RootQueryToMenuItemConnection {
  nodes: [MenuItem!]!
}

# Flat list with parentId — built into a tree client-side (header drill-down + footer columns).
type MenuItem {
  id: ID!
  parentId: ID
  label: String
  uri: String
  target: String
  description: String
}

type SiteOptions {
  logo: MediaItem
  strapline: String
  address: String
  headerCtaLabel: String
  headerCtaUrl: String
  social: [SiteOptionsSocial!]
  socialInHeader: Boolean
  phoneNumbers: [SiteOptionsPhone!]
}

type SiteOptionsSocial {
  label: String
  url: String
}

# Header phone(s) — one renders as a tel: link, multiple as a location dropdown
# (multi-location numbers, mirrors Great White's location_phone_numbers).
type SiteOptionsPhone {
  location: String
  number: String
}

enum PageIdType {
  SLUG
  URI
  DATABASE_ID
}

enum PostStatusEnum {
  PUBLISH
  DRAFT
}

input RootQueryToPageConnectionWhereArgs {
  status: PostStatusEnum
}

type RootQueryToPageConnection {
  nodes: [Page!]!
}

# Posts — drives the post_grid block's listing (a fetching block, not page content).
input RootQueryToPostConnectionWhereArgs {
  status: PostStatusEnum
  categoryName: String
}

type RootQueryToPostConnection {
  nodes: [Post!]!
}

type Post {
  databaseId: Int!
  title: String
  uri: String
  date: String
  modified: String
  excerpt: String
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
}

type NodeWithFeaturedImageToMediaItemConnectionEdge {
  node: MediaItem
}

type Page {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  seo: PostTypeSEO
  pageFields: Page_Pagefields
}

# Per-page SEO from Yoast, exposed by the "Add WPGraphQL SEO" plugin (boilerplate §6 —
# Yoast is the agency default, ADR/decision 2026-06-13). A MINIMAL subset of Yoast's
# PostTypeSEO — the fields generateMetadata maps. Regenerate the full SDL from live WP
# once Yoast is installed (codegen.ts). The frontend OVERRIDES canonical + OG url to the
# frontend origin (Yoast emits the WP origin); opengraphImage's WP media URL is fine
# (add the media host to next.config remotePatterns). schema.raw = Yoast's JSON-LD graph.
type PostTypeSEO {
  title: String
  metaDesc: String
  canonical: String
  metaRobotsNoindex: String
  metaRobotsNofollow: String
  opengraphTitle: String
  opengraphDescription: String
  opengraphImage: MediaItem
  twitterTitle: String
  twitterDescription: String
  twitterImage: MediaItem
  schema: SEOSchema
}

type SEOSchema {
  raw: String
}

# ACF field group "Page Fields" → the `blocks` Flexible Content field.
type Page_Pagefields {
  blocks: [Page_Pagefields_Blocks!]
}

# Flexible Content layouts → a discriminated union (switch on __typename).
union Page_Pagefields_Blocks =
    Page_Pagefields_Blocks_Hero
  | Page_Pagefields_Blocks_FeatureGrid
  | Page_Pagefields_Blocks_Faq
  | Page_Pagefields_Blocks_CtaBanner
  | Page_Pagefields_Blocks_LogoStrip
  | Page_Pagefields_Blocks_ContactForm
  | Page_Pagefields_Blocks_MediaText
  | Page_Pagefields_Blocks_CardGrid
  | Page_Pagefields_Blocks_ServicesGrid
  | Page_Pagefields_Blocks_UspBar
  | Page_Pagefields_Blocks_Reviews
  | Page_Pagefields_Blocks_RichText
  | Page_Pagefields_Blocks_Columns
  | Page_Pagefields_Blocks_Video
  | Page_Pagefields_Blocks_PostGrid
  | Page_Pagefields_Blocks_KeyTakeaways
  | Page_Pagefields_Blocks_StatWithSource
  | Page_Pagefields_Blocks_ComparisonTable
  | Page_Pagefields_Blocks_AuthorByline
  | Page_Pagefields_Blocks_Pricing
  | Page_Pagefields_Blocks_Team
  | Page_Pagefields_Blocks_StatsBand
  | Page_Pagefields_Blocks_TabbedContent
  | Page_Pagefields_Blocks_ProcessSteps
  | Page_Pagefields_Blocks_BentoGrid
  | Page_Pagefields_Blocks_CaseStudies
  | Page_Pagefields_Blocks_Timeline
  | Page_Pagefields_Blocks_Newsletter
  | Page_Pagefields_Blocks_Gallery
  | Page_Pagefields_Blocks_BeforeAfter
  | Page_Pagefields_Blocks_Toc
  | Page_Pagefields_Blocks_IntegrationsGrid
  | Page_Pagefields_Blocks_PricingMatrix
  | Page_Pagefields_Blocks_LocationsMap
  | Page_Pagefields_Blocks_VideoTestimonial
  | Page_Pagefields_Blocks_FeatureRows

