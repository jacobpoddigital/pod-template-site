# Baseline WPGraphQL + WPGraphQL-for-ACF schema — HAND-AUTHORED.
#
# A minimal, valid subset covering page-by-slug + the 6 starter block layouts.
# It exists so `pnpm codegen` and `pnpm build` run with NO live WordPress
# (ADR 0013 — build green offline; the dev mock renders against it).
#
# Per project: once ACF fields are defined on real WP, REGENERATE this file —
#   pnpm dlx get-graphql-schema "$WPGRAPHQL_URL" > src/lib/cms/schema.graphql
# then `pnpm codegen` and commit. Type names below follow WPGraphQL-for-ACF's
# convention (wpgraphql-acf 2.x: PageFieldsBlocks<Layout>Layout); the page-blocks
# section is GENERATED — see scripts/generate-acf-blocks.mjs + migrate-blocks-2x.mjs.

schema {
  query: RootQuery
  mutation: RootMutation
}

type RootQuery {
  # The logged-in WP user (core WPGraphQL) — null when the request carries no valid JWT.
  # Auth scaffolding (opt-in module, docs/auth.md). VERIFIED present on WPGraphQL 2.x.
  viewer: User
  page(id: ID!, idType: PageIdType): Page
  pages(first: Int, where: RootQueryToPageConnectionWhereArgs): RootQueryToPageConnection
  posts(first: Int, after: String, where: RootQueryToPostConnectionWhereArgs): RootQueryToPostConnection
  post(id: ID!, idType: PostIdType): Post
  categories(first: Int, where: RootQueryToCategoryConnectionWhereArgs): RootQueryToCategoryConnection
  category(id: ID!, idType: TermNodeIdTypeEnum): Category
  tags(first: Int, where: RootQueryToTagConnectionWhereArgs): RootQueryToTagConnection
  tag(id: ID!, idType: TermNodeIdTypeEnum): Tag
  user(id: ID!, idType: UserNodeIdTypeEnum): User
  users(first: Int, where: RootQueryToUserConnectionWhereArgs): RootQueryToUserConnection
  # Custom post type: Case Study (registered in wp/mu-plugins/pod-case-study-register.php
  # with show_in_graphql + graphql_single_name "caseStudy" / plural "caseStudies"). The
  # CPT-proves-the-concept slice — mirrors the blog's native-Post pattern but on a
  # REGISTERED CPT carrying its own ACF group (caseStudyFields). Regenerate the SDL from
  # live WP once the plugin + ACF group are active; type names follow WPGraphQL's CPT
  # convention so the hand-authored shapes survive the swap.
  caseStudies(first: Int, after: String, where: RootQueryToCaseStudyConnectionWhereArgs): RootQueryToCaseStudyConnection
  caseStudy(id: ID!, idType: CaseStudyIdType): CaseStudy
  menuItems(where: RootQueryToMenuItemConnectionWhereArgs): RootQueryToMenuItemConnection
  siteOptions: SiteOptions
}

enum UserNodeIdTypeEnum {
  SLUG
  DATABASE_ID
  ID
  EMAIL
  URI
}

# WPGraphQL ContentTypeEnum (subset) — for users(where: { hasPublishedPosts: [POST] }).
enum ContentTypeEnum {
  POST
  PAGE
}

input RootQueryToUserConnectionWhereArgs {
  hasPublishedPosts: [ContentTypeEnum]
}

type RootQueryToUserConnection {
  nodes: [User!]!
}

# Editor-managed chrome (header/footer). Menus → nav (WPGraphQL); site options →
# logo / CTA / footer extras (WPGraphQL-for-ACF options page). Per project: register
# the PRIMARY + FOOTER menu locations and a "Site Options" ACF options page, exposed
# to GraphQL, then regenerate this SDL.
enum MenuLocationEnum {
  PRIMARY
  FOOTER
}

input RootQueryToMenuItemConnectionWhereArgs {
  location: MenuLocationEnum
}

type RootQueryToMenuItemConnection {
  nodes: [MenuItem!]!
}

# Flat list with parentId — built into a tree client-side (header drill-down + footer columns).
type MenuItem {
  id: ID!
  parentId: ID
  label: String
  uri: String
  target: String
  description: String
}

type SiteOptions {
