enum PostStatusEnum {
  PUBLISH
  DRAFT
}

input RootQueryToPageConnectionWhereArgs {
  status: PostStatusEnum
}

type RootQueryToPageConnection {
  nodes: [Page!]!
}

# Posts — drives the post_grid block's listing AND the standard blog (workflow/34).
# Pagination is CORE WPGraphQL cursors (first/after + pageInfo.hasNextPage/endCursor) — NO
# plugin; getBlogPosts walks them for the path-based /blog/page/[n]. `tag` = tag slug;
# `search` = full-text; `notIn` excludes the featured post from page 1's grid.
input RootQueryToPostConnectionWhereArgs {
  status: PostStatusEnum
  categoryName: String
  tag: String
  search: String
  notIn: [ID]
  authorName: String
}

type RootQueryToPostConnection {
  nodes: [Post!]!
  pageInfo: RootQueryToPostConnectionPageInfo
}

# Standard WPGraphQL cursor PageInfo (always present, no addon).
type RootQueryToPostConnectionPageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Post {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  date: String
  modified: String
  excerpt: String
  # Full rendered post HTML (Gutenberg/classic editor output) — the blog renders this
  # sanitized in a prose container (workflow/34; rendered-WP-content model, ADR 0013).
  content: String
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
  author: NodeWithAuthorToUserConnectionEdge
  categories: PostToCategoryConnection
  tags: PostToTagConnection
  seo: PostTypeSEO
  # ACF "Post Fields" group (E-E-A-T citations, workflow/34). Register a `sources`
  # repeater on the Post type (Show in GraphQL) → regenerate the SDL. Null otherwise.
  postFields: Post_Postfields
}

type Post_Postfields {
  sources: [Post_Postfields_Sources!]
}
# A cited source — outbound reference rendered in the article's "Sources" section.
type Post_Postfields_Sources {
  label: String
  url: String
  publisher: String
}

type NodeWithFeaturedImageToMediaItemConnectionEdge {
  node: MediaItem
}

type NodeWithAuthorToUserConnectionEdge {
  node: User
}

# Post author — WPGraphQL User. `avatar` is Gravatar; `seo.social` / ACF user-meta can
# supply a richer profile image once registered (regenerate the SDL then).
type User {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  # Auth scaffolding (docs/auth.md). `email` + `capabilities` are core WPGraphQL fields,
  # restricted to the authenticated user / admins — used by the session + capability guards.
  # `id` is the global Relay id the JWT login payload returns.
  id: ID
  email: String
  capabilities: [String!]
  avatar: Avatar
  # Optional ACF user-meta (E-E-A-T, workflow/34) — role/title, a richer profile image,
  # `sameAs` social links, and a link to the Meet-the-Team profile. Register per project
  # (ACF "User" field group, Show in GraphQL) then regenerate the SDL; all null otherwise.
  roleTitle: String
  teamProfileUrl: String
  profileImage: MediaItem
  social: [UserSocial!]
  # Topic areas of expertise (E-E-A-T → Person.knowsAbout + a "Writes about" line).
  knowsAbout: [String!]
}
type UserSocial {
  label: String
  url: String
}
type Avatar {
  url: String
}

type PostToCategoryConnection {
  nodes: [Category!]!
}
type PostToTagConnection {
  nodes: [Tag!]!
}

# --- Taxonomies (workflow/34) ---
input RootQueryToCategoryConnectionWhereArgs {
