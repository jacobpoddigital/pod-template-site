# Baseline WPGraphQL + WPGraphQL-for-ACF schema — HAND-AUTHORED.
#
# A minimal, valid subset covering page-by-slug + the 6 starter block layouts.
# It exists so `pnpm codegen` and `pnpm build` run with NO live WordPress
# (ADR 0013 — build green offline; the dev mock renders against it).
#
# Per project: once ACF fields are defined on real WP, REGENERATE this file —
#   pnpm dlx get-graphql-schema "$WPGRAPHQL_URL" > src/lib/cms/schema.graphql
# then `pnpm codegen` and commit. Type names below follow WPGraphQL-for-ACF's
# convention (Page_Pagefields_Blocks_<Layout>), so queries survive the swap.

schema {
  query: RootQuery
}

type RootQuery {
  page(id: ID!, idType: PageIdType): Page
  pages(first: Int, where: RootQueryToPageConnectionWhereArgs): RootQueryToPageConnection
}

enum PageIdType {
  SLUG
  URI
  DATABASE_ID
}

enum PostStatusEnum {
  PUBLISH
  DRAFT
}

input RootQueryToPageConnectionWhereArgs {
  status: PostStatusEnum
}

type RootQueryToPageConnection {
  nodes: [Page!]!
}

type Page {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  pageFields: Page_Pagefields
}

# ACF field group "Page Fields" → the `blocks` Flexible Content field.
type Page_Pagefields {
  blocks: [Page_Pagefields_Blocks!]
}

# Flexible Content layouts → a discriminated union (switch on __typename).
union Page_Pagefields_Blocks =
    Page_Pagefields_Blocks_Hero
  | Page_Pagefields_Blocks_FeatureGrid
  | Page_Pagefields_Blocks_Faq
  | Page_Pagefields_Blocks_CtaBanner
  | Page_Pagefields_Blocks_LogoStrip
  | Page_Pagefields_Blocks_ContactForm
  | Page_Pagefields_Blocks_MediaText
  | Page_Pagefields_Blocks_CardGrid
  | Page_Pagefields_Blocks_ServicesGrid
  | Page_Pagefields_Blocks_UspBar
  | Page_Pagefields_Blocks_Reviews
  | Page_Pagefields_Blocks_RichText
  | Page_Pagefields_Blocks_Columns
  | Page_Pagefields_Blocks_Video

type Page_Pagefields_Blocks_Hero {
  eyebrow: String
  heading: String
  subheading: String
  ctaLabel: String
  ctaUrl: String
  secondaryLabel: String
  secondaryUrl: String
  tone: String
}

type Page_Pagefields_Blocks_FeatureGrid {
  heading: String
  intro: String
  tone: String
  features: [Page_Pagefields_Blocks_FeatureGrid_Features!]
}

type Page_Pagefields_Blocks_FeatureGrid_Features {
  title: String
  body: String
  icon: String
}

type Page_Pagefields_Blocks_Faq {
  heading: String
  tone: String
  items: [Page_Pagefields_Blocks_Faq_Items!]
}

type Page_Pagefields_Blocks_Faq_Items {
  question: String
  answer: String
}

type Page_Pagefields_Blocks_CtaBanner {
  heading: String
  body: String
  ctaLabel: String
  ctaUrl: String
  tone: String
}

type Page_Pagefields_Blocks_LogoStrip {
  heading: String
  tone: String
  logos: [Page_Pagefields_Blocks_LogoStrip_Logos!]
}

type Page_Pagefields_Blocks_LogoStrip_Logos {
  name: String
}

type Page_Pagefields_Blocks_ContactForm {
  heading: String
  intro: String
  submitLabel: String
  successMessage: String
  tone: String
}

# media + text block. `spacing` + `container` are the editor-controlled
# section_settings (alongside `tone`) — see src/lib/section-settings.ts.
type Page_Pagefields_Blocks_MediaText {
  eyebrow: String
  heading: String
  body: String
  ctaLabel: String
  ctaUrl: String
  image: MediaItem
  mediaPosition: String
  mediaRatio: String
  tone: String
  spacing: String
  container: String
}

# WordPress MediaItem (an ACF image field). Minimal subset — regenerating the SDL
# from real WP brings the full type; the block only reads these.
type MediaItem {
  sourceUrl: String
  altText: String
  mediaDetails: MediaDetails
}

type MediaDetails {
  width: Int
  height: Int
}

# --- Tier-1 marketing blocks (workflow/29). All carry the editor section_settings
# (tone · spacing · container). camelCase here; the query aliases back to snake_case. ---

type Page_Pagefields_Blocks_CardGrid {
  heading: String
  intro: String
  columns: Int
  cards: [Page_Pagefields_Blocks_CardGrid_Cards!]
  tone: String
  spacing: String
  container: String
}
type Page_Pagefields_Blocks_CardGrid_Cards {
  image: MediaItem
  title: String
  body: String
  linkLabel: String
  linkUrl: String
}

type Page_Pagefields_Blocks_ServicesGrid {
  heading: String
  intro: String
  columns: Int
  services: [Page_Pagefields_Blocks_ServicesGrid_Services!]
  tone: String
  spacing: String
  container: String
}
type Page_Pagefields_Blocks_ServicesGrid_Services {
  image: MediaItem
  title: String
  body: String
  linkLabel: String
  linkUrl: String
}

type Page_Pagefields_Blocks_UspBar {
  columns: Int
  items: [Page_Pagefields_Blocks_UspBar_Items!]
  tone: String
  spacing: String
  container: String
}
type Page_Pagefields_Blocks_UspBar_Items {
  image: MediaItem
  text: String
  linkUrl: String
}

type Page_Pagefields_Blocks_Reviews {
  heading: String
  intro: String
  columns: Int
  reviews: [Page_Pagefields_Blocks_Reviews_Reviews!]
  tone: String
  spacing: String
  container: String
}
type Page_Pagefields_Blocks_Reviews_Reviews {
  quote: String
  author: String
  role: String
  rating: Int
}

type Page_Pagefields_Blocks_RichText {
  content: String
  tone: String
  spacing: String
  container: String
}

type Page_Pagefields_Blocks_Columns {
  heading: String
  intro: String
  columnCount: Int
  columns: [Page_Pagefields_Blocks_Columns_Columns!]
  tone: String
  spacing: String
  container: String
}
type Page_Pagefields_Blocks_Columns_Columns {
  content: String
}

type Page_Pagefields_Blocks_Video {
  heading: String
  videoId: String
  facadeImage: MediaItem
  buttonText: String
  tone: String
  spacing: String
  container: String
}
