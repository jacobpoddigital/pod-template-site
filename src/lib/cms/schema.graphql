# Category. `categoryImage` is an ACF image field registered on the category taxonomy
# and exposed to WPGraphQL (the archive banner background — Great White's category
# featured image, ported). Register it per project, then regenerate the SDL.
type Category {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  count: Int
  categoryImage: MediaItem
}

type Tag {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  count: Int
}

type Page {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  seo: PostTypeSEO
  pageFields: PageFields
}

# Per-page SEO from Yoast, exposed by the "Add WPGraphQL SEO" plugin (boilerplate §6 —
# Yoast is the agency default, ADR/decision 2026-06-13). A MINIMAL subset of Yoast's
# PostTypeSEO — the fields generateMetadata maps. Regenerate the full SDL from live WP
# once Yoast is installed (codegen.ts). The frontend OVERRIDES canonical + OG url to the
# frontend origin (Yoast emits the WP origin); opengraphImage's WP media URL is fine
# (add the media host to next.config remotePatterns). schema.raw = Yoast's JSON-LD graph.
type PostTypeSEO {
  title: String
  metaDesc: String
  canonical: String
  metaRobotsNoindex: String
  metaRobotsNofollow: String
  opengraphTitle: String
  opengraphDescription: String
  opengraphImage: MediaItem
  twitterTitle: String
  twitterDescription: String
  twitterImage: MediaItem
  schema: SEOSchema
}

type SEOSchema {
  raw: String
}

# WordPress MediaItem (an ACF image field). Minimal subset — regenerating the SDL
# from real WP brings the full type; the block only reads these.
type MediaItem {
  sourceUrl: String
  altText: String
  mediaDetails: MediaDetails
}

type MediaDetails {
  width: Int
  height: Int
}

# ============================================================================
# Authentication — opt-in scaffolding (docs/auth.md). HAND-AUTHORED SDL subset.
#
# `login` / `refreshJwtAuthToken` come from the wp-graphql-jwt-authentication
# plugin (the GO-LIVE GATE: install + verify against WPGraphQL 2.x — see
# docs/auth.md §Go-live). `sendPasswordResetEmail` / `resetUserPassword` /
# `viewer` are CORE WPGraphQL and were VERIFIED present on a live 2.x endpoint
# (2026-06-15). Regenerate the full SDL from live WP once the JWT plugin is on.
# ============================================================================

type RootMutation {
  # --- wp-graphql-jwt-authentication (verify on go-live) ---
  login(input: LoginInput!): LoginPayload
  refreshJwtAuthToken(input: RefreshJwtAuthTokenInput!): RefreshJwtAuthTokenPayload
  # --- core WPGraphQL (verified on 2.x) ---
  sendPasswordResetEmail(input: SendPasswordResetEmailInput!): SendPasswordResetEmailPayload
  resetUserPassword(input: ResetUserPasswordInput!): ResetUserPasswordPayload
}

input LoginInput {
  clientMutationId: String
  username: String!
  password: String!
}
type LoginPayload {
  authToken: String
  refreshToken: String
  user: User
}

input RefreshJwtAuthTokenInput {
  clientMutationId: String
  jwtRefreshToken: String!
}
type RefreshJwtAuthTokenPayload {
  authToken: String
}

# Core: `username` accepts a login OR an email. Returns success (the legacy `user`
# field is intentionally not selected — it leaks existence; we always show a generic
# "if an account exists…" message).
input SendPasswordResetEmailInput {
  clientMutationId: String
  username: String!
}
type SendPasswordResetEmailPayload {
  success: Boolean
}

# Core: completes the reset using the emailed key + login.
input ResetUserPasswordInput {
  clientMutationId: String
  key: String!
  login: String!
  password: String!
}
type ResetUserPasswordPayload {
  user: User
}

# ============================================================================
# Case Study — CUSTOM POST TYPE (the CPT-proves-the-concept slice).
# Mirrors the blog's native-Post shape, but on a registered CPT (`case_study`,
# show_in_graphql) carrying its OWN ACF group `caseStudyFields`. This block is
# exactly what WPGraphQL + WPGraphQL-for-ACF generate when the CPT + group exist;
# regenerate from live WP to confirm once provisioned. See workflow on CPTs.
# ============================================================================

enum CaseStudyIdType {
  DATABASE_ID
  ID
  SLUG
  URI
}

# CPT connection where-args. Core WPGraphQL cursor pagination (same as posts, no addon);
# `search` powers the index filter when added.
input RootQueryToCaseStudyConnectionWhereArgs {
  status: PostStatusEnum
  search: String
  notIn: [ID]
}

type RootQueryToCaseStudyConnection {
  nodes: [CaseStudy!]!
  pageInfo: RootQueryToCaseStudyConnectionPageInfo
}
type RootQueryToCaseStudyConnectionPageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

# One case study. Native WP fields (title/slug/content/featuredImage/date) PLUS the
# ACF group exposed as `caseStudyFields` — the part a CPT adds over a native post.
type CaseStudy {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  date: String
  modified: String
  excerpt: String
  # Full rendered CPT body HTML (the narrative) — sanitized + rendered in a prose container.
  content: String
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
  seo: PostTypeSEO
  # ACF field group "Case Study Fields" (Show in GraphQL → graphql_field_name
  # "caseStudyFields"). The structured proof an editor fills in alongside the body.
  caseStudyFields: CaseStudy_Casestudyfields
}

type CaseStudy_Casestudyfields {
  client: String
  industry: String
  # One-line outcome shown on the card + hero standfirst.
  summary: String
  websiteUrl: String
  # Headline result numbers — a repeater of label/value pairs (e.g. "Organic traffic" / "+148%").
  metrics: [CaseStudy_Casestudyfields_Metrics!]
}
type CaseStudy_Casestudyfields_Metrics {
  label: String
  value: String
}

