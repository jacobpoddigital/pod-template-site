# media + text block. `spacing` + `container` are the editor-controlled
# section_settings (alongside `tone`) — see src/lib/section-settings.ts.
type Page_Pagefields_Blocks_MediaText {
  eyebrow: String
  heading: String
  body: String
  ctaLabel: String
  ctaUrl: String
  image: MediaItem
  videoId: String
  mediaPosition: String
  mediaRatio: String
  tone: String
  spacing: String
  container: String
  anchor: String
}

# WordPress MediaItem (an ACF image field). Minimal subset — regenerating the SDL
# from real WP brings the full type; the block only reads these.
type MediaItem {
  sourceUrl: String
  altText: String
  mediaDetails: MediaDetails
}

type MediaDetails {
  width: Int
  height: Int
}

