# Baseline WPGraphQL + WPGraphQL-for-ACF schema — HAND-AUTHORED.
#
# A minimal, valid subset covering page-by-slug + the 6 starter block layouts.
# It exists so `pnpm codegen` and `pnpm build` run with NO live WordPress
# (ADR 0013 — build green offline; the dev mock renders against it).
#
# Per project: once ACF fields are defined on real WP, REGENERATE this file —
#   pnpm dlx get-graphql-schema "$WPGRAPHQL_URL" > src/lib/cms/schema.graphql
# then `pnpm codegen` and commit. Type names below follow WPGraphQL-for-ACF's
# convention (Page_Pagefields_Blocks_<Layout>), so queries survive the swap.

schema {
  query: RootQuery
  mutation: RootMutation
}

type RootQuery {
  # The logged-in WP user (core WPGraphQL) — null when the request carries no valid JWT.
  # Auth scaffolding (opt-in module, docs/auth.md). VERIFIED present on WPGraphQL 2.x.
  viewer: User
  page(id: ID!, idType: PageIdType): Page
  pages(first: Int, where: RootQueryToPageConnectionWhereArgs): RootQueryToPageConnection
  posts(first: Int, where: RootQueryToPostConnectionWhereArgs): RootQueryToPostConnection
  post(id: ID!, idType: PostIdType): Post
  categories(first: Int, where: RootQueryToCategoryConnectionWhereArgs): RootQueryToCategoryConnection
  category(id: ID!, idType: TermNodeIdTypeEnum): Category
  tags(first: Int, where: RootQueryToTagConnectionWhereArgs): RootQueryToTagConnection
  tag(id: ID!, idType: TermNodeIdTypeEnum): Tag
  user(id: ID!, idType: UserNodeIdTypeEnum): User
  users(first: Int, where: RootQueryToUserConnectionWhereArgs): RootQueryToUserConnection
  menuItems(where: RootQueryToMenuItemConnectionWhereArgs): RootQueryToMenuItemConnection
  siteOptions: SiteOptions
}

enum UserNodeIdTypeEnum {
  SLUG
  DATABASE_ID
  ID
  EMAIL
  URI
}

# WPGraphQL ContentTypeEnum (subset) — for users(where: { hasPublishedPosts: [POST] }).
enum ContentTypeEnum {
  POST
  PAGE
}

input RootQueryToUserConnectionWhereArgs {
  hasPublishedPosts: [ContentTypeEnum]
}

type RootQueryToUserConnection {
  nodes: [User!]!
}

# Editor-managed chrome (header/footer). Menus → nav (WPGraphQL); site options →
# logo / CTA / footer extras (WPGraphQL-for-ACF options page). Per project: register
# the PRIMARY + FOOTER menu locations and a "Site Options" ACF options page, exposed
# to GraphQL, then regenerate this SDL.
enum MenuLocationEnum {
  PRIMARY
  FOOTER
}

input RootQueryToMenuItemConnectionWhereArgs {
  location: MenuLocationEnum
}

type RootQueryToMenuItemConnection {
  nodes: [MenuItem!]!
}

# Flat list with parentId — built into a tree client-side (header drill-down + footer columns).
type MenuItem {
  id: ID!
  parentId: ID
  label: String
  uri: String
  target: String
  description: String
}

type SiteOptions {
  logo: MediaItem
  strapline: String
  address: String
  headerCtaLabel: String
  headerCtaUrl: String
  social: [SiteOptionsSocial!]
  socialInHeader: Boolean
  phoneNumbers: [SiteOptionsPhone!]
}

type SiteOptionsSocial {
  label: String
  url: String
}

# Header phone(s) — one renders as a tel: link, multiple as a location dropdown
# (multi-location numbers, mirrors Great White's location_phone_numbers).
type SiteOptionsPhone {
  location: String
  number: String
}

enum PageIdType {
  SLUG
  URI
  DATABASE_ID
}

enum PostIdType {
  SLUG
  URI
  DATABASE_ID
}

# Shared id-type for taxonomy terms (categories + tags) — WPGraphQL's TermNodeIdTypeEnum.
enum TermNodeIdTypeEnum {
  SLUG
  ID
  DATABASE_ID
  NAME
  URI
}

enum PostStatusEnum {
  PUBLISH
  DRAFT
}

input RootQueryToPageConnectionWhereArgs {
  status: PostStatusEnum
}

type RootQueryToPageConnection {
  nodes: [Page!]!
}

# Posts — drives the post_grid block's listing AND the standard blog (workflow/34).
# `offsetPagination` REQUIRES the free "WPGraphQL Offset Pagination" addon on WP — it
# powers the blog's path-based /blog/page/[n] (SEO-clean offsets, not cursors). Without
# the addon this where-field is not in the real schema and the query fails validation —
# provision.sh installs it (workflow/34). `tag` = tag slug; `search` = full-text;
# `notIn` excludes the featured post from page 1's grid.
input RootQueryToPostConnectionWhereArgs {
  status: PostStatusEnum
  categoryName: String
  tag: String
  search: String
  notIn: [ID]
  authorName: String
  offsetPagination: OffsetPagination
}

# WPGraphQL Offset Pagination addon input.
input OffsetPagination {
  offset: Int
  size: Int
}

type RootQueryToPostConnection {
  nodes: [Post!]!
  pageInfo: RootQueryToPostConnectionPageInfo
}

# pageInfo.offsetPagination is contributed by the addon — `total` drives page counts.
type RootQueryToPostConnectionPageInfo {
  offsetPagination: OffsetPaginationPageInfo
}
type OffsetPaginationPageInfo {
  total: Int
  hasMore: Boolean
  hasPrevious: Boolean
}

type Post {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  date: String
  modified: String
  excerpt: String
  # Full rendered post HTML (Gutenberg/classic editor output) — the blog renders this
  # sanitized in a prose container (workflow/34; rendered-WP-content model, ADR 0013).
  content: String
  featuredImage: NodeWithFeaturedImageToMediaItemConnectionEdge
  author: NodeWithAuthorToUserConnectionEdge
  categories: PostToCategoryConnection
  tags: PostToTagConnection
  seo: PostTypeSEO
  # ACF "Post Fields" group (E-E-A-T citations, workflow/34). Register a `sources`
  # repeater on the Post type (Show in GraphQL) → regenerate the SDL. Null otherwise.
  postFields: Post_Postfields
}

type Post_Postfields {
  sources: [Post_Postfields_Sources!]
}
# A cited source — outbound reference rendered in the article's "Sources" section.
type Post_Postfields_Sources {
  label: String
  url: String
  publisher: String
}

type NodeWithFeaturedImageToMediaItemConnectionEdge {
  node: MediaItem
}

type NodeWithAuthorToUserConnectionEdge {
  node: User
}

# Post author — WPGraphQL User. `avatar` is Gravatar; `seo.social` / ACF user-meta can
# supply a richer profile image once registered (regenerate the SDL then).
type User {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  # Auth scaffolding (docs/auth.md). `email` + `capabilities` are core WPGraphQL fields,
  # restricted to the authenticated user / admins — used by the session + capability guards.
  # `id` is the global Relay id the JWT login payload returns.
  id: ID
  email: String
  capabilities: [String!]
  avatar: Avatar
  # Optional ACF user-meta (E-E-A-T, workflow/34) — role/title, a richer profile image,
  # `sameAs` social links, and a link to the Meet-the-Team profile. Register per project
  # (ACF "User" field group, Show in GraphQL) then regenerate the SDL; all null otherwise.
  roleTitle: String
  teamProfileUrl: String
  profileImage: MediaItem
  social: [UserSocial!]
  # Topic areas of expertise (E-E-A-T → Person.knowsAbout + a "Writes about" line).
  knowsAbout: [String!]
}
type UserSocial {
  label: String
  url: String
}
type Avatar {
  url: String
}

type PostToCategoryConnection {
  nodes: [Category!]!
}
type PostToTagConnection {
  nodes: [Tag!]!
}

# --- Taxonomies (workflow/34) ---
input RootQueryToCategoryConnectionWhereArgs {
  hideEmpty: Boolean
}
type RootQueryToCategoryConnection {
  nodes: [Category!]!
}
input RootQueryToTagConnectionWhereArgs {
  hideEmpty: Boolean
}
type RootQueryToTagConnection {
  nodes: [Tag!]!
}

# Category. `categoryImage` is an ACF image field registered on the category taxonomy
# and exposed to WPGraphQL (the archive banner background — Great White's category
# featured image, ported). Register it per project, then regenerate the SDL.
type Category {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  count: Int
  categoryImage: MediaItem
}

type Tag {
  databaseId: Int!
  name: String
  slug: String
  description: String
  uri: String
  count: Int
}

type Page {
  databaseId: Int!
  title: String
  slug: String
  uri: String
  seo: PostTypeSEO
  pageFields: Page_Pagefields
}

# Per-page SEO from Yoast, exposed by the "Add WPGraphQL SEO" plugin (boilerplate §6 —
# Yoast is the agency default, ADR/decision 2026-06-13). A MINIMAL subset of Yoast's
# PostTypeSEO — the fields generateMetadata maps. Regenerate the full SDL from live WP
# once Yoast is installed (codegen.ts). The frontend OVERRIDES canonical + OG url to the
# frontend origin (Yoast emits the WP origin); opengraphImage's WP media URL is fine
# (add the media host to next.config remotePatterns). schema.raw = Yoast's JSON-LD graph.
type PostTypeSEO {
  title: String
  metaDesc: String
  canonical: String
  metaRobotsNoindex: String
  metaRobotsNofollow: String
  opengraphTitle: String
  opengraphDescription: String
  opengraphImage: MediaItem
  twitterTitle: String
  twitterDescription: String
  twitterImage: MediaItem
  schema: SEOSchema
}

type SEOSchema {
  raw: String
}

# ACF field group "Page Fields" → the `blocks` Flexible Content field.
type Page_Pagefields {
  blocks: [Page_Pagefields_Blocks!]
}

