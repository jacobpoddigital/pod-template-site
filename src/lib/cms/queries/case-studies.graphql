# One batch of case studies for the index grid. CORE WPGraphQL cursor pagination
# (`first`/`after` + pageInfo.hasNextPage/endCursor) — NO plugin, same shape as the blog,
# proving the CPT participates in the exact pagination contract a native post type does.
# `caseStudyFields` is the ACF group the CPT adds over a native post.
query CaseStudies($first: Int!, $after: String, $notIn: [ID]) {
  caseStudies(
    first: $first
    after: $after
    where: {
      status: PUBLISH
      notIn: $notIn
    }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      databaseId
      title
      slug
      uri
      date
      excerpt
      featuredImage {
        node {
          sourceUrl
          altText
        }
      }
      caseStudyFields {
        client
        industry
        summary
        metrics {
          label
          value
        }
      }
    }
  }
}
