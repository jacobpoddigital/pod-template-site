# Every published post — drives the sitemap (boilerplate §6). URL = the WP `uri`
# (the post's permalink); `modified` becomes <lastmod>. NOTE: the template ships
# PAGES-only routes — a blog post needs a matching frontend route (e.g.
# app/blog/[slug]) before these URLs resolve. See docs/seo.md.
query AllPosts {
  posts(first: 1000, where: { status: PUBLISH }) {
    nodes {
      databaseId
      uri
      date
      modified
    }
  }
}
