# A single blog post by slug (workflow/33). Returns the full rendered `content`
# (sanitized + rendered in a prose container), author box data, categories/tags, and
# Yoast `seo` (the per-post meta + Article JSON-LD, same source as pages). Featured
# image is a connection edge → flatten in the cms layer (FRICTION 2.x edge pattern).
query PostBySlug($slug: ID!) {
  post(id: $slug, idType: SLUG) {
    databaseId
    title
    slug
    uri
    date
    modified
    content
    featuredImage {
      node {
        sourceUrl
        altText
        mediaDetails {
          width
          height
        }
      }
    }
    author {
      node {
        name
        slug
        description
        uri
        avatar {
          url
        }
      }
    }
    categories {
      nodes {
        name
        slug
        uri
      }
    }
    tags {
      nodes {
        name
        slug
        uri
      }
    }
    seo {
      title
      metaDesc
      canonical
      metaRobotsNoindex
      metaRobotsNofollow
      opengraphTitle
      opengraphDescription
      opengraphImage {
        sourceUrl
        altText
        mediaDetails {
          width
          height
        }
      }
      twitterTitle
      twitterDescription
      twitterImage {
        sourceUrl
        altText
      }
      schema {
        raw
      }
    }
  }
}
