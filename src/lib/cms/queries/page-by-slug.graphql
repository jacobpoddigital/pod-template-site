# One inline fragment per registered block. Aliases map WPGraphQL's camelCase
# (ctaLabel) back to the snake_case field names the block zod schemas expect
# (cta_label) — so the adapter stays generic and blocks/schemas are untouched.
# Add a fragment here when you add a block (the /new-block recipe).
query PageBySlug($slug: ID!) {
  page(id: $slug, idType: URI) {
    databaseId
    title
    slug
    uri
    # Yoast SEO via "Add WPGraphQL SEO" (free). canonical is fetched but the frontend
    # OVERRIDES it to the frontend origin (Yoast emits the WP origin). schema.raw is
    # Yoast's per-page JSON-LD graph, injected on the page.
    seo {
      title
      metaDesc
      canonical
      metaRobotsNoindex
      metaRobotsNofollow
      opengraphTitle
      opengraphDescription
      opengraphImage { ...MediaItemFields }
      twitterTitle
      twitterDescription
      twitterImage {
        sourceUrl
        altText
      }
      schema {
        raw
      }
    }
    pageFields {
      blocks {
        __typename
        ... on PageFieldsBlocksAuthorBylineLayout {
          name
          role
          date
          bio
          profile_url: profileUrl
          avatar {
            node { sourceUrl altText mediaDetails { width height } }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksBeforeAfterLayout {
          heading
          intro
          before_image: afterImage {
            node { sourceUrl altText mediaDetails { width height } }
          }
          after_image: beforeImage {
            node { sourceUrl altText mediaDetails { width height } }
          }
          before_label: beforeLabel
          after_label: afterLabel
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksBentoGridLayout {
          heading
          intro
          items: bentoGridItems {
            title
            body
            span
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            link_url: linkUrl
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksCardGridLayout {
          heading
          intro
          columns
          layout
          cards: cardGridCards {
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            title
            body
            link_label: linkLabel
            link_url: linkUrl
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksCaseStudiesLayout {
          heading
          intro
          columns
          items: caseStudiesItems {
            metric
            summary
            client
            link_label: linkLabel
            link_url: linkUrl
            logo {
              node { sourceUrl altText mediaDetails { width height } }
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksColumnsLayout {
          heading
          intro
          column_count: columnCount
          column_items: columnsColumns {
            content
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksComparisonTableLayout {
          heading
          intro
          option_a_label: optionALabel
          option_b_label: optionBLabel
          rows: comparisonTableRows {
            feature
            option_a: optionA
            option_b: optionB
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksContactFormLayout {
          heading
          intro
          submit_label: submitLabel
          success_message: successMessage
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksCtaBannerLayout {
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          secondary_label: secondaryLabel
          secondary_url: secondaryUrl
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksFaqLayout {
          heading
          tone
          spacing
          container
          anchor
          custom_class: customClass
          items: faqItems {
            question
            answer
          }
        }
        ... on PageFieldsBlocksFeatureGridLayout {
          heading
          intro
          tone
          spacing
          container
          anchor
          custom_class: customClass
          features: featureGridFeatures {
            title
            body
            icon
          }
        }
        ... on PageFieldsBlocksFeatureRowsLayout {
          heading
          intro
          rows: featureRowsRows {
            eyebrow
            title
            body
            cta_label: ctaLabel
            cta_url: ctaUrl
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksGalleryLayout {
          heading
          intro
          columns
          images: galleryImages {
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            caption
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksHeroLayout {
          eyebrow
          heading
          subheading
          cta_label: ctaLabel
          cta_url: ctaUrl
          secondary_label: secondaryLabel
          secondary_url: secondaryUrl
          image {
            node { sourceUrl altText mediaDetails { width height } }
          }
          layout
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksIntegrationsGridLayout {
          heading
          intro
          columns
          items: integrationsGridItems {
            name
            url
            logo {
              node { sourceUrl altText mediaDetails { width height } }
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksKeyTakeawaysLayout {
          heading
          points: keyTakeawaysPoints {
            text
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksLocationsMapLayout {
          heading
          intro
          columns
          locations: locationsMapLocations {
            name
            address
            maps_url: mapsUrl
            phone
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksLogoStripLayout {
          heading
          tone
          spacing
          container
          anchor
          custom_class: customClass
          logos: logoStripLogos {
            name
          }
        }
        ... on PageFieldsBlocksMediaTextLayout {
          eyebrow
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          image {
            node { sourceUrl altText mediaDetails { width height } }
          }
          video_id: videoId
          media_position: mediaPosition
          media_ratio: mediaRatio
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksNewsletterLayout {
          heading
          intro
          placeholder
          button_label: buttonLabel
          success_message: successMessage
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksPostGridLayout {
          heading
          intro
          category
          count
          columns
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksPricingLayout {
          heading
          intro
          plans: pricingPlans {
            name
            price
            price_annual: priceAnnual
            period
            description
            featured
            badge
            cta_label: ctaLabel
            cta_url: ctaUrl
            features: pricingPlansFeatures {
              text
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksPricingMatrixLayout {
          heading
          intro
          plan_labels: pricingMatrixPlanLabels {
            label
          }
          rows: pricingMatrixRows {
            feature
            value1
            value2
            value3
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksProcessStepsLayout {
          heading
          intro
          steps: processStepsSteps {
            title
            body
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksReviewsLayout {
          heading
          intro
          columns
          layout
          reviews: reviewsReviews {
            quote
            author
            role
            rating
            avatar {
              node { sourceUrl altText mediaDetails { width height } }
            }
            company_logo: companyLogo {
              node { sourceUrl altText mediaDetails { width height } }
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksRichTextLayout {
          content
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksServicesGridLayout {
          heading
          intro
          columns
          layout
          services: servicesGridServices {
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            title
            body
            link_label: linkLabel
            link_url: linkUrl
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksStatWithSourceLayout {
          heading
          intro
          columns
          stats: statWithSourceStats {
            value
            label
            source
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksStatsBandLayout {
          heading
          intro
          columns
          stats: statsBandStats {
            value
            label
            description
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksTabbedContentLayout {
          heading
          intro
          tabs: tabbedContentTabs {
            label
            content
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksTeamLayout {
          heading
          intro
          columns
          members: teamMembers {
            name
            role
            bio
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            linkedin_url: linkedinUrl
            twitter_url: twitterUrl
            website_url: websiteUrl
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksTimelineLayout {
          heading
          intro
          events: timelineEvents {
            date
            title
            body
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksTocLayout {
          heading
          items: tocItems {
            label
            target
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksUspBarLayout {
          columns
          items: uspBarItems {
            image {
              node { sourceUrl altText mediaDetails { width height } }
            }
            text
            link_url: linkUrl
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksVideoLayout {
          heading
          video_id: videoId
          facade_image: facadeImage {
            node { sourceUrl altText mediaDetails { width height } }
          }
          button_text: buttonText
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
        ... on PageFieldsBlocksVideoTestimonialLayout {
          heading
          intro
          columns
          items: videoTestimonialItems {
            video_id: videoId
            quote
            author
            role
            facade_image: facadeImage {
              node { sourceUrl altText mediaDetails { width height } }
            }
          }
          tone
          spacing
          container
          anchor
          custom_class: customClass
        }
      }
    }
  }
}
