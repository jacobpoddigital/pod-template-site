# One inline fragment per registered block. Aliases map WPGraphQL's camelCase
# (ctaLabel) back to the snake_case field names the block zod schemas expect
# (cta_label) — so the adapter stays generic and blocks/schemas are untouched.
# Add a fragment here when you add a block (the /new-block recipe).
query PageBySlug($slug: ID!) {
  page(id: $slug, idType: URI) {
    databaseId
    title
    slug
    uri
    pageFields {
      blocks {
        __typename
        ... on Page_Pagefields_Blocks_Hero {
          eyebrow
          heading
          subheading
          cta_label: ctaLabel
          cta_url: ctaUrl
          secondary_label: secondaryLabel
          secondary_url: secondaryUrl
          layout
          tone
          image {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_FeatureGrid {
          heading
          intro
          tone
          spacing
          container
          features {
            title
            body
            icon
          }
        }
        ... on Page_Pagefields_Blocks_Faq {
          heading
          tone
          spacing
          container
          items {
            question
            answer
          }
        }
        ... on Page_Pagefields_Blocks_CtaBanner {
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          tone
          spacing
          container
        }
        ... on Page_Pagefields_Blocks_LogoStrip {
          heading
          tone
          spacing
          container
          logos {
            name
          }
        }
        ... on Page_Pagefields_Blocks_ContactForm {
          heading
          intro
          submit_label: submitLabel
          success_message: successMessage
          tone
          spacing
          container
        }
        ... on Page_Pagefields_Blocks_MediaText {
          eyebrow
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          video_id: videoId
          media_position: mediaPosition
          media_ratio: mediaRatio
          tone
          spacing
          container
          image {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_CardGrid {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          cards {
            title
            body
            link_label: linkLabel
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_ServicesGrid {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          services {
            title
            body
            link_label: linkLabel
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_UspBar {
          columns
          tone
          spacing
          container
          items {
            text
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_Reviews {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          reviews {
            quote
            author
            role
            rating
          }
        }
        ... on Page_Pagefields_Blocks_RichText {
          content
          tone
          spacing
          container
        }
        ... on Page_Pagefields_Blocks_Columns {
          heading
          intro
          column_count: columnCount
          tone
          spacing
          container
          column_items: columns {
            content
          }
        }
        ... on Page_Pagefields_Blocks_Video {
          heading
          video_id: videoId
          button_text: buttonText
          tone
          spacing
          container
          facade_image: facadeImage {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_PostGrid {
          heading
          intro
          category
          count
          columns
          tone
          spacing
          container
        }
        ... on Page_Pagefields_Blocks_KeyTakeaways {
          heading
          tone
          spacing
          container
          points {
            text
          }
        }
        ... on Page_Pagefields_Blocks_StatWithSource {
          heading
          intro
          columns
          tone
          spacing
          container
          stats {
            value
            label
            source
          }
        }
        ... on Page_Pagefields_Blocks_ComparisonTable {
          heading
          intro
          option_a_label: optionALabel
          option_b_label: optionBLabel
          tone
          spacing
          container
          rows {
            feature
            option_a: optionA
            option_b: optionB
          }
        }
        ... on Page_Pagefields_Blocks_AuthorByline {
          name
          role
          date
          bio
          profile_url: profileUrl
          tone
          spacing
          container
          avatar {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
      }
    }
  }
}
