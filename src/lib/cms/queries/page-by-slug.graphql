# One inline fragment per registered block. Aliases map WPGraphQL's camelCase
# (ctaLabel) back to the snake_case field names the block zod schemas expect
# (cta_label) — so the adapter stays generic and blocks/schemas are untouched.
# Add a fragment here when you add a block (the /new-block recipe).
query PageBySlug($slug: ID!) {
  page(id: $slug, idType: URI) {
    databaseId
    title
    slug
    uri
    pageFields {
      blocks {
        __typename
        ... on Page_Pagefields_Blocks_Hero {
          eyebrow
          heading
          subheading
          cta_label: ctaLabel
          cta_url: ctaUrl
          secondary_label: secondaryLabel
          secondary_url: secondaryUrl
          layout
          tone
          spacing
          container
          anchor
          image {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_FeatureGrid {
          heading
          intro
          tone
          spacing
          container
          anchor
          features {
            title
            body
            icon
          }
        }
        ... on Page_Pagefields_Blocks_Faq {
          heading
          tone
          spacing
          container
          anchor
          items {
            question
            answer
          }
        }
        ... on Page_Pagefields_Blocks_CtaBanner {
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          tone
          spacing
          container
          anchor
        }
        ... on Page_Pagefields_Blocks_LogoStrip {
          heading
          tone
          spacing
          container
          anchor
          logos {
            name
          }
        }
        ... on Page_Pagefields_Blocks_ContactForm {
          heading
          intro
          submit_label: submitLabel
          success_message: successMessage
          tone
          spacing
          container
          anchor
        }
        ... on Page_Pagefields_Blocks_MediaText {
          eyebrow
          heading
          body
          cta_label: ctaLabel
          cta_url: ctaUrl
          video_id: videoId
          media_position: mediaPosition
          media_ratio: mediaRatio
          tone
          spacing
          container
          anchor
          image {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_CardGrid {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          anchor
          cards {
            title
            body
            link_label: linkLabel
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_ServicesGrid {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          anchor
          services {
            title
            body
            link_label: linkLabel
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_UspBar {
          columns
          tone
          spacing
          container
          anchor
          items {
            text
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_Reviews {
          heading
          intro
          columns
          layout
          tone
          spacing
          container
          anchor
          reviews {
            quote
            author
            role
            rating
            avatar {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
            company_logo: companyLogo {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_RichText {
          content
          tone
          spacing
          container
          anchor
        }
        ... on Page_Pagefields_Blocks_Columns {
          heading
          intro
          column_count: columnCount
          tone
          spacing
          container
          anchor
          column_items: columns {
            content
          }
        }
        ... on Page_Pagefields_Blocks_Video {
          heading
          video_id: videoId
          button_text: buttonText
          tone
          spacing
          container
          anchor
          facade_image: facadeImage {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_PostGrid {
          heading
          intro
          category
          count
          columns
          tone
          spacing
          container
          anchor
        }
        ... on Page_Pagefields_Blocks_KeyTakeaways {
          heading
          tone
          spacing
          container
          anchor
          points {
            text
          }
        }
        ... on Page_Pagefields_Blocks_StatWithSource {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          stats {
            value
            label
            source
          }
        }
        ... on Page_Pagefields_Blocks_ComparisonTable {
          heading
          intro
          option_a_label: optionALabel
          option_b_label: optionBLabel
          tone
          spacing
          container
          anchor
          rows {
            feature
            option_a: optionA
            option_b: optionB
          }
        }
        ... on Page_Pagefields_Blocks_AuthorByline {
          name
          role
          date
          bio
          profile_url: profileUrl
          tone
          spacing
          container
          anchor
          avatar {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_Pricing {
          heading
          intro
          tone
          spacing
          container
          anchor
          plans {
            name
            price
            price_annual: priceAnnual
            period
            description
            featured
            badge
            cta_label: ctaLabel
            cta_url: ctaUrl
            features {
              text
            }
          }
        }
        ... on Page_Pagefields_Blocks_Team {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          members {
            name
            role
            bio
            linkedin_url: linkedinUrl
            twitter_url: twitterUrl
            website_url: websiteUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_StatsBand {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          stats {
            value
            label
            description
          }
        }
        ... on Page_Pagefields_Blocks_TabbedContent {
          heading
          intro
          tone
          spacing
          container
          anchor
          tabs {
            label
            content
          }
        }
        ... on Page_Pagefields_Blocks_ProcessSteps {
          heading
          intro
          tone
          spacing
          container
          anchor
          steps {
            title
            body
          }
        }
        ... on Page_Pagefields_Blocks_BentoGrid {
          heading
          intro
          tone
          spacing
          container
          anchor
          items {
            title
            body
            span
            link_url: linkUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_CaseStudies {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          items {
            metric
            summary
            client
            link_label: linkLabel
            link_url: linkUrl
            logo {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_Timeline {
          heading
          intro
          tone
          spacing
          container
          anchor
          events {
            date
            title
            body
          }
        }
        ... on Page_Pagefields_Blocks_Newsletter {
          heading
          intro
          placeholder
          button_label: buttonLabel
          success_message: successMessage
          tone
          spacing
          container
          anchor
        }
        ... on Page_Pagefields_Blocks_Gallery {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          images {
            caption
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_BeforeAfter {
          heading
          intro
          before_label: beforeLabel
          after_label: afterLabel
          tone
          spacing
          container
          anchor
          before_image: beforeImage {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
          after_image: afterImage {
            sourceUrl
            altText
            mediaDetails {
              width
              height
            }
          }
        }
        ... on Page_Pagefields_Blocks_Toc {
          heading
          tone
          spacing
          container
          anchor
          items {
            label
            target
          }
        }
        ... on Page_Pagefields_Blocks_IntegrationsGrid {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          items {
            name
            url
            logo {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_PricingMatrix {
          heading
          intro
          tone
          spacing
          container
          anchor
          plan_labels: planLabels {
            label
          }
          rows {
            feature
            value1
            value2
            value3
          }
        }
        ... on Page_Pagefields_Blocks_LocationsMap {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          locations {
            name
            address
            maps_url: mapsUrl
            phone
          }
        }
        ... on Page_Pagefields_Blocks_VideoTestimonial {
          heading
          intro
          columns
          tone
          spacing
          container
          anchor
          items {
            video_id: videoId
            quote
            author
            role
            facade_image: facadeImage {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
        ... on Page_Pagefields_Blocks_FeatureRows {
          heading
          intro
          tone
          spacing
          container
          anchor
          rows {
            eyebrow
            title
            body
            cta_label: ctaLabel
            cta_url: ctaUrl
            image {
              sourceUrl
              altText
              mediaDetails {
                width
                height
              }
            }
          }
        }
      }
    }
  }
}
