# One category by slug — the archive banner (name + description + categoryImage) and
# its post count (for page-count math). workflow/33.
query CategoryBySlug($slug: ID!) {
  category(id: $slug, idType: SLUG) {
    databaseId
    name
    slug
    description
    count
    categoryImage {
      sourceUrl
      altText
      mediaDetails {
        width
        height
      }
    }
  }
}
