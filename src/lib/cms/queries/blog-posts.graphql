# One batch of blog posts for the index + archives (workflow/34). CORE WPGraphQL cursor
# pagination (`first`/`after` + pageInfo.hasNextPage/endCursor) — NO plugin. getBlogPosts
# walks these batches to build the path-based /blog/page/[n] window + an exact total.
# `category`/`tag` (slugs) scope the archive routes; `search` powers the filter search;
# `notIn` excludes the featured post. `content` is requested so cards can show a reading
# time (drop it to lighten the listing — see docs/blog.md).
query BlogPosts(
  $first: Int!
  $after: String
  $category: String
  $tag: String
  $search: String
  $author: String
  $notIn: [ID]
) {
  posts(
    first: $first
    after: $after
    where: {
      status: PUBLISH
      categoryName: $category
      tag: $tag
      search: $search
      authorName: $author
      notIn: $notIn
    }
  ) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      databaseId
      title
      slug
      uri
      date
      excerpt
      content
      featuredImage {
        node {
          sourceUrl
          altText
        }
      }
      author {
        node {
          name
          slug
        }
      }
      categories {
        nodes {
          name
          slug
        }
      }
    }
  }
}
