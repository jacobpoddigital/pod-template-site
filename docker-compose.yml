# Local headless WordPress for development (workflow/01 §Phase 4).
# TEMPLATE: set WP_PORT in .env or export before running.
# These credentials are LOCAL-ONLY throwaways — production secrets never live here.
#
#   docker compose up -d   → WP admin at http://localhost:${WP_PORT:-8081}/wp-admin
#   ACF_PRO_ZIP=~/path/acf-pro.zip docker compose run --rm --user root --entrypoint bash cli -c "bash /wp/provision.sh"

services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "wordpress", "-pwordpress"]
      interval: 5s
      timeout: 3s
      retries: 10

  wordpress:
    image: wordpress:6
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html

  # WP-CLI sidecar — invoked via provision.sh, not started by default.
  # Must run as root: volume mounts start root-owned, wp-content/upgrade creation fails otherwise.
  cli:
    image: wordpress:cli
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp:/opt/pod-wp:ro
      - ./wp/acf-fields:/opt/pod-wp/acf-fields:ro

volumes:
  db_data:
  wp_data:
