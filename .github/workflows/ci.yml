# CI gate on every PR: lint + typecheck + build (workflow/02 — agents cannot
# merge violations). Build runs WITHOUT WordPress: fallback content must keep
# the build green, proving "WP down ≠ site down" on every PR.
#
# Repo setting required: "Require approval for workflow runs" from outside
# collaborators, so agent-authored PRs never auto-run CI (workflow/01 §Phase 6).

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
